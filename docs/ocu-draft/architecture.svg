<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#eaf0f8"/>
    </linearGradient>
    <linearGradient id="svr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a4f86"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .t{ fill:#1f2933; }
      .mut{ fill:#6b7280; }
      .wht{ fill:#ffffff; }
      .box{ stroke:#cdd7e5; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="url(#bg)"/>
  <text x="40" y="48" font-size="26" font-weight="700" class="t">企业法律咨询 H5 系统 · 架构说明图</text>
  <text x="40" y="74" font-size="14" class="mut">给企业老板（客户）用 · AI 先答普通问题 · 疑难转律师手机 · 公司电脑做服务器，花生壳/cpolar 对外</text>
  <line x1="40" y1="88" x2="1060" y2="88" stroke="#d6deea"/>

  <!-- 客户手机 -->
  <g>
    <rect x="60" y="140" width="200" height="360" rx="20" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
    <rect x="72" y="158" width="176" height="26" rx="6" fill="#1a4f86"/>
    <text x="160" y="176" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">客户 H5（手机）</text>
    <rect x="80" y="196" width="160" height="40" rx="8" fill="#eef4ff" stroke="#bcd2f0"/>
    <text x="160" y="221" font-size="12" fill="#334" text-anchor="middle">输入法律问题</text>
    <rect x="80" y="246" width="160" height="40" rx="8" fill="#eef4ff" stroke="#bcd2f0"/>
    <text x="160" y="271" font-size="12" fill="#334" text-anchor="middle">看 AI 回答</text>
    <rect x="80" y="296" width="160" height="40" rx="8" fill="#fff3e6" stroke="#ffd591"/>
    <text x="160" y="321" font-size="12" fill="#8a5a00" text-anchor="middle">一键「转人工」</text>
    <rect x="80" y="346" width="160" height="40" rx="8" fill="#eef4ff" stroke="#bcd2f0"/>
    <text x="160" y="371" font-size="12" fill="#334" text-anchor="middle">查律师回复</text>
    <rect x="80" y="396" width="160" height="40" rx="8" fill="#eef4ff" stroke="#bcd2f0"/>
    <text x="160" y="421" font-size="12" fill="#334" text-anchor="middle">历史咨询记录</text>
    <text x="160" y="470" font-size="11" fill="#9aa6b6" text-anchor="middle">企业老板 / 客户</text>
  </g>

  <!-- 服务器 -->
  <g>
    <rect x="430" y="120" width="260" height="400" rx="16" fill="url(#svr)"/>
    <rect x="450" y="140" width="220" height="30" rx="6" fill="#ffffff" opacity="0.12"/>
    <text x="560" y="161" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">公司电脑 · 服务器</text>

    <rect x="452" y="182" width="216" height="44" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="560" y="209" font-size="13" fill="#1a4f86" text-anchor="middle" font-weight="600">Web 服务 (Node/Express)</text>

    <rect x="452" y="236" width="216" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="560" y="261" font-size="12" fill="#334" text-anchor="middle">LLM 接入层（法律问答）</text>

    <rect x="452" y="286" width="216" height="40" rx="8" fill="#fff7e6" stroke="#ffd591"/>
    <text x="560" y="311" font-size="12" fill="#8a5a00" text-anchor="middle">疑难判定 + 转人工路由</text>

    <rect x="452" y="336" width="216" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="560" y="361" font-size="12" fill="#334" text-anchor="middle">推送模块（通知律师）</text>

    <rect x="452" y="386" width="216" height="40" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="560" y="411" font-size="12" fill="#334" text-anchor="middle">数据库（JSON / SQL Server）</text>

    <text x="560" y="470" font-size="11" fill="#cfe0f5" text-anchor="middle">放律师公司内网 · 数据不出门</text>
    <text x="560" y="492" font-size="11" fill="#cfe0f5" text-anchor="middle">开机自启 · 7×24 运行</text>
  </g>

  <!-- 律师端 -->
  <g>
    <rect x="840" y="140" width="200" height="360" rx="20" fill="#fff" stroke="#b9c6d8" stroke-width="2"/>
    <rect x="852" y="158" width="176" height="26" rx="6" fill="#167a45"/>
    <text x="940" y="176" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">律师端（手机/电脑）</text>
    <rect x="860" y="196" width="160" height="40" rx="8" fill="#e8f7ee" stroke="#9bd9b3"/>
    <text x="940" y="221" font-size="12" fill="#0f5a2e" text-anchor="middle">收到疑难推送</text>
    <rect x="860" y="246" width="160" height="40" rx="8" fill="#e8f7ee" stroke="#9bd9b3"/>
    <text x="940" y="271" font-size="12" fill="#0f5a2e" text-anchor="middle">撰写专业回复</text>
    <rect x="860" y="296" width="160" height="40" rx="8" fill="#e8f7ee" stroke="#9bd9b3"/>
    <text x="940" y="321" font-size="12" fill="#0f5a2e" text-anchor="middle">待处理列表</text>
    <rect x="860" y="346" width="160" height="40" rx="8" fill="#e8f7ee" stroke="#9bd9b3"/>
    <text x="940" y="371" font-size="12" fill="#0f5a2e" text-anchor="middle">知识库 / 统计</text>
    <rect x="860" y="396" width="160" height="40" rx="8" fill="#e8f7ee" stroke="#9bd9b3"/>
    <text x="940" y="421" font-size="12" fill="#0f5a2e" text-anchor="middle">历史 &amp; 客户管理</text>
    <text x="940" y="470" font-size="11" fill="#9aa6b6" text-anchor="middle">你朋友（律师）</text>
  </g>

  <!-- 连接线 -->
  <line x1="260" y1="320" x2="428" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="262" font-size="11" fill="#6b7280" transform="rotate(-20 345 262)">提问 / 看AI答</text>

  <line x1="428" y1="300" x2="262" y2="356" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="345" font-size="11" fill="#6b7280">AI 回答 / 律师回复</text>

  <line x1="690" y1="306" x2="838" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="262" font-size="11" fill="#c0392b" transform="rotate(18 760 262)">疑难推送</text>

  <line x1="838" y1="356" x2="692" y2="306" stroke="#167a45" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="345" font-size="11" fill="#167a45">律师回复回填</text>

  <!-- 花生壳/cpolar 外网穿透 -->
  <rect x="300" y="560" width="500" height="120" rx="14" fill="#fff" stroke="#cdd7e5" stroke-dasharray="6 5"/>
  <text x="550" y="588" font-size="15" font-weight="700" fill="#1a4f86" text-anchor="middle">花生壳 / cpolar 内网穿透（对外发布）</text>
  <text x="550" y="614" font-size="13" fill="#555" text-anchor="middle">公司内网电脑  ←──  HTTPS 域名  ──→  客户手机浏览器</text>
  <text x="550" y="638" font-size="12" fill="#888" text-anchor="middle">开启 HTTPS + 访问口令/白名单，咨询内容不外泄</text>
  <text x="550" y="662" font-size="12" fill="#888" text-anchor="middle">建议给客户发邀请码，不是谁都能进</text>

  <line x1="560" y1="520" x2="560" y2="558" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="545" font-size="11" fill="#6b7280">对外暴露</text>

  <!-- 底部说明 -->
  <text x="40" y="725" font-size="12" fill="#9aa6b6">流程：客户提问 → LLM 秒回普通问题 → 疑难/客户转人工 → 推送律师 → 律师回复回填 → 全程留痕可审计。技术复用已验证的「海关评估系统」框架，开发快、稳。</text>
</svg>
